<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">

      <p-toast></p-toast>

      <!-- ================== TOOLBAR ================== -->
      <p-toolbar class="mb-4">
        <ng-template pTemplate="left">
          <h5 class="m-0">Administrar Valores</h5>
        </ng-template>
      </p-toolbar>

      <!-- ================== TABLA ================== -->
      <p-table
        #dt
        [value]="valoresTranspuestos"
        dataKey="rowKey"
        responsiveLayout="scroll"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="rowsPerPageOptions"
        [loading]="wait"
        [rowHover]="true"
      >

        <!-- ================== CAPTION / FILTROS ================== -->
        <ng-template pTemplate="caption">
          <div
            class="flex flex-column md:flex-row md:justify-content-between md:align-items-center gap-3">

            <div class="flex align-items-center gap-2">
              <span class="font-semibold">Filtrar por estado:</span>

              <p-dropdown
                [options]="estados"
                optionLabel="nombre"
                optionValue="codigo"
                placeholder="Estado"
                [(ngModel)]="selectedEstadoId"
                (onChange)="onEstadoFilterChange($event.value)">
              </p-dropdown>
            </div>

          </div>
        </ng-template>

        <!-- ================== HEADER ================== -->
        <ng-template pTemplate="header">
          <tr>
            <th style="min-width: 160px;">Partido</th>
            <th style="min-width: 90px; text-align: center;">Año</th>

            <th *ngFor="let mes of mesesRequeridos"
                style="min-width: 80px; text-align: center;">
              {{ mes }}
            </th>

            <th style="min-width: 70px; text-align: center;">
              +
            </th>
          </tr>
        </ng-template>

        <!-- ================== BODY ================== -->
        <ng-template pTemplate="body" let-fila>
          <tr>

            <!-- Partido -->
            <td style="min-width: 160px;">
              {{ fila.partidoNombre }}
            </td>

            <!-- Año -->
            <td style="min-width: 90px; text-align: center;">
              <p-inputNumber
                [(ngModel)]="fila.anio"
                [useGrouping]="false"
                [min]="2000"
                [max]="2100"
                inputStyleClass="w-full text-center">
              </p-inputNumber>
            </td>

            <!-- Meses -->
            <td *ngFor="let mes of mesesRequeridos"
                style="min-width: 80px; text-align: center;">

              <p-inputNumber
                [(ngModel)]="fila[mes].porcentaje"
                mode="decimal"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                inputStyleClass="w-full text-center"
                (onBlur)="onMesValueChange(fila, mes, fila[mes].porcentaje)">
              </p-inputNumber>

            </td>

            <!-- Acciones -->
            <td style="text-align: center;">

                <!-- Agregar año anterior -->
  <button
    pButton
    icon="pi pi-calendar-minus"
    class="p-button-rounded p-button-text p-button-sm"
    pTooltip="Agregar año anterior"
    tooltipPosition="left"
    (click)="agregarAnioAnteriorDesdeFila(fila)">
  </button>
  
              <button
                pButton
                icon="pi pi-calendar-plus"
                class="p-button-rounded p-button-text p-button-sm"
                pTooltip="Agregar año siguiente"
                tooltipPosition="left"
                (click)="agregarAnioDesdeFila(fila)">
              </button>
              <button
  pButton
  icon="pi pi-trash"
  class="p-button-rounded p-button-text p-button-sm p-button-danger"
  pTooltip="Eliminar año completo"
  tooltipPosition="left"
  (click)="eliminarFila(fila)">
</button>

            </td>
            

          </tr>
        </ng-template>

      </p-table>

    </div>
  </div>
</div>
